services:
  - type: web
    name: paperpilot-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: CLIENT_ORIGIN
        sync: false
      - key: FORM_URL
        sync: false
    healthCheckPath: /health
