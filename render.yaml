services:
  - type: web
    name: paperpilot-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx playwright install chromium --with-deps
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: CLIENT_ORIGIN
        sync: false
    healthCheckPath: /health
